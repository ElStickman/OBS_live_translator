<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live English captions</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: flex-end; justify-content: center; font-family: Arial, sans-serif; }
    #captions {
      width: 100%; min-height: 1px; margin-bottom: 6%;
      position: relative; display: flex; justify-content: center;
    }
    .caption {
      position: absolute; bottom: 0; width: max-content;
      max-width: 85%; padding: .25em .5em;
      color: white; background: transparent; text-align: center;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(32px, 4.5vw, 68px); font-weight: 400; line-height: 1.08;
      letter-spacing: .025em;
      -webkit-text-stroke: clamp(2px, .18vw, 4px) black;
      paint-order: stroke fill;
      text-shadow: 0 3px 2px black, 2px 2px 2px black, -2px 2px 2px black;
      opacity: 1; transition: transform 350ms ease;
      animation: fade-caption 10s linear 5s forwards;
      pointer-events: none;
    }
    .caption .highlight {
      color: var(--highlight-color, #ffd400) !important;
      -webkit-text-fill-color: var(--highlight-color, #ffd400);
    }
    .caption.typing::after {
      content: ""; display: inline-block; width: .08em; height: .82em;
      margin-left: .08em; background: white; box-shadow: 0 0 0 2px black;
      animation: blink 700ms steps(1, end) infinite; vertical-align: -.04em;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fade-caption {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .caption { transition: none; }
      .caption.typing::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="captions" role="status" aria-live="polite"></div>
  <script>
    let caption = null;
    const captions = document.querySelector('#captions');
    let sequence = -1;
    let highlightSignature = '';
    let animationFrame = null;
    const charactersPerSecond = 24;

    function layoutCaptions() {
      let offset = 0;
      for (const item of [...captions.children].reverse()) {
        item.style.transform = `translateY(-${offset}px)`;
        offset += item.offsetHeight;
      }
    }
    const resizeObserver = new ResizeObserver(layoutCaptions);

    function removeCaption(item) {
      if (item === caption) {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        caption = null;
      }
      resizeObserver.unobserve(item);
      item.remove();
      layoutCaptions();
    }

    function renderHighlighted(text, highlights, caption) {
      caption.replaceChildren();
      if (!highlights.length) {
        caption.textContent = text;
        return;
      }

      const colors = new Map(
        highlights.map(item => [item.term.toLowerCase(), item.color || '#ffd400'])
      );
      const escaped = highlights
        .map(item => item.term)
        .filter(Boolean)
        .sort((a, b) => b.length - a.length)
        .map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const matcher = new RegExp(escaped.join('|'), 'gi');
      let cursor = 0;
      for (const match of text.matchAll(matcher)) {
        caption.append(document.createTextNode(text.slice(cursor, match.index)));
        const highlighted = document.createElement('span');
        highlighted.className = 'highlight';
        highlighted.textContent = match[0];
        highlighted.style.setProperty(
          '--highlight-color', colors.get(match[0].toLowerCase()) || '#ffd400'
        );
        caption.append(highlighted);
        cursor = match.index + match[0].length;
      }
      caption.append(document.createTextNode(text.slice(cursor)));
    }

    function typeCaption(text, highlights) {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        renderHighlighted(text, highlights, caption);
        caption.classList.remove('typing');
        animationFrame = null;
        return;
      }
      const current = caption.textContent;
      const canAppend = text.startsWith(current);
      const initialCount = canAppend ? current.length : 0;
      if (!canAppend) caption.replaceChildren();
      caption.classList.add('typing');
      const startedAt = performance.now();

      function type(now) {
        const count = Math.min(
          text.length,
          initialCount + Math.floor((now - startedAt) * charactersPerSecond / 1000)
        );
        renderHighlighted(text.slice(0, count), highlights, caption);
        if (count < text.length) {
          animationFrame = requestAnimationFrame(type);
        } else {
          caption.classList.remove('typing');
          animationFrame = null;
        }
      }
      animationFrame = requestAnimationFrame(type);
    }

    function addCaption(text, highlights) {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      if (caption) {
        renderHighlighted(caption.dataset.text, highlights, caption);
        caption.classList.remove('typing');
      }
      if (captions.children.length === 3) removeCaption(captions.firstElementChild);
      caption = document.createElement('div');
      caption.className = 'caption';
      caption.dataset.text = text;
      const item = caption;
      item.addEventListener('animationend', event => {
        if (event.animationName === 'fade-caption' && event.target === item) {
          removeCaption(item);
        }
      });
      captions.append(caption);
      resizeObserver.observe(caption);
      typeCaption(text, highlights);
      layoutCaptions();
    }

    async function refresh() {
      try {
        const response = await fetch('/api/caption', { cache: 'no-store' });
        const data = await response.json();
        const highlights = data.highlights || (data.highlight_terms || []).map(
          term => ({ term, color: '#ffd400' })
        );
        const nextHighlightSignature = JSON.stringify(highlights);
        if (data.sequence !== sequence) {
          sequence = data.sequence;
          if (data.text && data.visible) addCaption(data.text, highlights);
        }
        if (nextHighlightSignature !== highlightSignature) {
          highlightSignature = nextHighlightSignature;
          for (const item of captions.children) {
            renderHighlighted(item.textContent, highlights, item);
          }
          if (caption && animationFrame) typeCaption(caption.dataset.text, highlights);
        }
      } catch (_) {
        // Existing captions keep their own lifetime during connection failures.
      }
    }
    setInterval(refresh, 200);
    refresh();
  </script>
</body>
</html>
