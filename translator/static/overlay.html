<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live English captions</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: flex-end; justify-content: center; font-family: Arial, sans-serif; }
    #captions {
      width: 100%; min-height: 1px; margin-bottom: 6%;
      display: flex; flex-direction: column; align-items: center;
    }
    .caption {
      max-width: 85%; padding: .25em .5em;
      color: white; background: transparent; text-align: center;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(32px, 4.5vw, 68px); font-weight: 400; line-height: 1.08;
      letter-spacing: .025em;
      -webkit-text-stroke: clamp(2px, .18vw, 4px) black;
      paint-order: stroke fill;
      text-shadow: 0 3px 2px black, 2px 2px 2px black, -2px 2px 2px black;
      opacity: 0; transition: opacity 160ms ease;
    }
    .caption.visible { opacity: 1; }
    .caption.level-2 { opacity: .5; }
    .caption.level-3 { opacity: .25; }
    .caption.fading-out {
      animation: fade-caption 900ms ease-out forwards;
      pointer-events: none;
    }
    .caption .highlight {
      color: var(--highlight-color, #ffd400) !important;
      -webkit-text-fill-color: var(--highlight-color, #ffd400);
    }
    .caption.typing::after {
      content: ""; display: inline-block; width: .08em; height: .82em;
      margin-left: .08em; background: white; box-shadow: 0 0 0 2px black;
      animation: blink 700ms steps(1, end) infinite; vertical-align: -.04em;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fade-caption {
      from { opacity: .25; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="captions">
    <div id="caption" class="caption" role="status" aria-live="polite"></div>
  </div>
  <script>
    const caption = document.querySelector('#caption');
    const captions = document.querySelector('#captions');
    let sequence = -1;
    let highlightSignature = '';
    let animationFrame = null;
    let currentVisible = false;
    let levelTimer = null;
    const charactersPerSecond = 24;
    const levelDurationMs = 5000;

    function renderHighlighted(text, highlights) {
      caption.replaceChildren();
      if (!highlights.length) {
        caption.textContent = text;
        return;
      }

      const colors = new Map(
        highlights.map(item => [item.term.toLowerCase(), item.color || '#ffd400'])
      );
      const escaped = highlights
        .map(item => item.term)
        .filter(Boolean)
        .sort((a, b) => b.length - a.length)
        .map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const matcher = new RegExp(escaped.join('|'), 'gi');
      let cursor = 0;
      for (const match of text.matchAll(matcher)) {
        caption.append(document.createTextNode(text.slice(cursor, match.index)));
        const highlighted = document.createElement('span');
        highlighted.className = 'highlight';
        highlighted.textContent = match[0];
        highlighted.style.setProperty(
          '--highlight-color', colors.get(match[0].toLowerCase()) || '#ffd400'
        );
        caption.append(highlighted);
        cursor = match.index + match[0].length;
      }
      caption.append(document.createTextNode(text.slice(cursor)));
    }

    function typeCaption(text, highlights) {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      const current = caption.textContent;
      const canAppend = text.startsWith(current);
      const initialCount = canAppend ? current.length : 0;
      if (!canAppend) caption.replaceChildren();
      caption.classList.add('typing');
      const startedAt = performance.now();

      function type(now) {
        const count = Math.min(
          text.length,
          initialCount + Math.floor((now - startedAt) * charactersPerSecond / 1000)
        );
        renderHighlighted(text.slice(0, count), highlights);
        if (count < text.length) {
          animationFrame = requestAnimationFrame(type);
        } else {
          caption.classList.remove('typing');
          animationFrame = null;
        }
      }
      animationFrame = requestAnimationFrame(type);
    }

    function moveCurrentCaptionToHistory() {
      if (!caption.textContent || !caption.classList.contains('visible')) return;
      removeLevelThree();
      const levelTwo = captions.querySelector('.level-2');
      if (levelTwo) levelTwo.classList.replace('level-2', 'level-3');
      const previous = caption.cloneNode(true);
      previous.removeAttribute('id');
      previous.classList.remove('typing', 'visible');
      previous.classList.add('level-2');
      captions.insertBefore(previous, caption);
    }

    function removeLevelThree() {
      const levelThree = captions.querySelector('.level-3');
      if (!levelThree) return;
      levelThree.classList.add('fading-out');
      levelThree.addEventListener('animationend', () => levelThree.remove(), { once: true });
    }

    function advanceCaptionLevel() {
      if (caption.textContent && caption.classList.contains('visible')) {
        moveCurrentCaptionToHistory();
        clearCurrentCaption();
      } else {
        const levelTwo = captions.querySelector('.level-2');
        if (levelTwo) {
          removeLevelThree();
          levelTwo.classList.replace('level-2', 'level-3');
        } else {
          removeLevelThree();
        }
      }
      if (captions.querySelector('.level-2, .level-3')) {
        levelTimer = setTimeout(advanceCaptionLevel, levelDurationMs);
      } else {
        levelTimer = null;
      }
    }

    function restartLevelTimer() {
      if (levelTimer) clearTimeout(levelTimer);
      levelTimer = setTimeout(advanceCaptionLevel, levelDurationMs);
    }

    function clearCurrentCaption() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      caption.replaceChildren();
      caption.classList.remove('typing', 'visible');
    }

    async function refresh() {
      try {
        const response = await fetch('/api/caption', { cache: 'no-store' });
        const data = await response.json();
        const highlights = data.highlights || (data.highlight_terms || []).map(
          term => ({ term, color: '#ffd400' })
        );
        const nextHighlightSignature = JSON.stringify(highlights);
        if (data.sequence !== sequence || nextHighlightSignature !== highlightSignature) {
          sequence = data.sequence;
          highlightSignature = nextHighlightSignature;
          if (data.text) {
            moveCurrentCaptionToHistory();
            typeCaption(data.text, highlights);
            restartLevelTimer();
          }
        }
        if (currentVisible && !data.visible) {
          const hasCurrentCaption = Boolean(caption.textContent);
          if (hasCurrentCaption) {
            moveCurrentCaptionToHistory();
            clearCurrentCaption();
            restartLevelTimer();
          }
        } else {
          caption.classList.toggle('visible', data.visible);
        }
        currentVisible = data.visible;
      } catch (_) {
        currentVisible = false;
        caption.classList.remove('visible');
      }
    }
    setInterval(refresh, 200);
    refresh();
  </script>
</body>
</html>
